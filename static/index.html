<title>Sehat Saathi</title><style>:root{--ink:#1d2b3a;--bg:#fff7e0;--line:#f0dca8;--blue:#1d4ed8;--sun:#ffb703;--mut:#4a5a6a;--ok:#0a6650;--warn:#9a4a06;--bad:#b4234f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 92% -8%,#ffe08a 0,transparent 42%),var(--bg);color:var(--ink);font:20px/1.55 "Trebuchet MS",Verdana,system-ui,sans-serif}

:focus-visible{outline:5px solid #7c3aed;outline-offset:3px}input,select,textarea{width:100%;min-height:56px;padding:12px;font-size:1.05rem;border:3px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
label{display:block;margin:12px 0 4px;font-weight:700}.card{background:#fff;border:2px solid var(--line);border-top:8px solid var(--sun);border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 6px 18px rgba(120,80,0,.12)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut);font-size:.95rem}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;border:2px solid;font-weight:700;font-size:.9rem}.taken{color:var(--ok)}.missed{color:var(--bad)}.unconfirmed{color:var(--warn)}.upcoming{color:var(--blue)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav button{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}nav button[aria-current=true]{background:var(--sun);border-color:var(--sun)}
dialog{border:3px solid var(--sun);border-radius:22px;background:#fff7e0;color:var(--ink);width:min(540px,94vw)}#msg{position:sticky;top:0;z-index:5}
.bar{display:flex;gap:3px;height:56px;align-items:flex-end}.bar i{flex:1;background:#138a5e;min-height:3px;border-radius:3px 3px 0 0}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:10px;z-index:9}
.flip{position:relative;perspective:1100px;margin:18px 0}.face{position:relative;display:flex;flex-direction:column;gap:8px;min-height:230px;padding:20px;border-radius:26px;color:#fff;backface-visibility:hidden;transition:transform .6s;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 0 rgba(0,0,0,.2),0 7px 0 rgba(0,0,0,.12),0 18px 26px rgba(0,0,0,.2)}
.back{position:absolute;inset:0;transform:rotateY(180deg);background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 8px 0 rgba(0,0,0,.1),0 18px 26px rgba(0,0,0,.15)}.flip.on .front{transform:rotateY(-180deg)}.flip.on .back{transform:rotateY(0)}
.front.taken{background:linear-gradient(135deg,#138a5e,#0a6650)}.front.unconfirmed{background:linear-gradient(135deg,#c2610a,#9a4a06)}.front.upcoming{background:linear-gradient(135deg,#2f6fed,#1d4ed8)}.front.missed{background:linear-gradient(135deg,#d6336c,#b4234f)}
.pill{display:inline-block;width:46px;height:22px;border-radius:99px;background:linear-gradient(90deg,#fff 50%,#ffd166 50%);transform:rotate(-18deg)}.nm{font-size:1.8rem;line-height:1.2}.t{font-size:1.2rem;font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}.state{font-size:1.25rem;font-weight:800}.dots i{display:inline-block;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.55)}.dots i+i{margin-left:-13px;background:rgba(255,209,102,.9)}
.face .big{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}.face .ghost{background:transparent;color:inherit;border-color:currentColor;box-shadow:none}.turn{align-self:flex-end;background:none;border:0;box-shadow:none;color:inherit;text-decoration:underline;min-height:44px;padding:4px 8px}
.mic{position:fixed;right:18px;bottom:18px;min-height:76px;padding:0 30px;border-radius:99px;font-size:1.3rem;z-index:8;display:flex;align-items:center;gap:10px;background:var(--bad);border-color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.skipped{color:var(--mut)}.front.skipped{background:linear-gradient(135deg,#5b6b7b,#3f4d5a)}html.lg body{font-size:25px}.pct{font-size:2.4rem;font-weight:800;color:var(--ok);margin:.1em 0}

</style></head><body><a class="skip" href="#app">Skip to content</a><main><div id="msg" role="status" aria-live="polite"></div><div id="app">Loading…</div></main><dialog id="dlg" aria-labelledby="dt"></dialog><dialog id="ai"><h2 style="margin-top:0">Talk to Sehat Saathi</h2><button class="big" id="aispeak" onclick="listen()">Tap and speak (Hindi / English)</button><p id="aitxt" class="mut" role="status" aria-live="polite"></p><p id="aireply" aria-live="polite" style="font-size:1.25rem"></p><div id="aiyn" hidden class="row"><button class="big" onclick="yes()">Yes</button><button class="ghost big" onclick="no()">No</button></div><form onsubmit="event.preventDefault();askAI($('#aiq').value);$('#aiq').value=''"><label for="aiq">Or type your question</label><input id="aiq" placeholder="Aaj ki dawa kaun si hai?"><p><button>Ask</button> <button type="button" class="ghost" onclick="speechSynthesis&&speechSynthesis.cancel();$('#ai').close()">Close</button></p></form></dialog>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={me:null,pid:null,data:null,tab:'today'};
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json','X-Requested-With':'SehatSaathi'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){say(j.error||'Something went wrong',1);throw j}return j}
function aimsg(t,bad){const e=$('#aitxt');e.textContent=t;e.style.color=bad?'var(--bad)':''}
function say(t,bad){if($('#ai').open)aimsg(t,bad);$('#msg').innerHTML=`<div class="card" style="border-color:var(--${bad?'bad':'ok'});color:var(--${bad?'bad':'ok'})"><b>${E(t)}</b></div>`;setTimeout(()=>$('#msg').innerHTML='',5000)}
function ask(title,fields,ok){const d=$('#dlg');d.innerHTML=`<form method="dialog"><h2 id="dt">${E(title)}</h2>${fields.map(f=>`<label for="f_${f[0]}">${f[1]}</label>${f[2]=='select'?`<select id="f_${f[0]}">${f[3].map(o=>`<option value="${o[0]}">${E(o[1])}</option>`).join('')}</select>`:`<input id="f_${f[0]}" type="${f[2]||'text'}" value="${E(f[3]||'')}" ${f[4]||''}>`}`).join('')}<div class="row" style="margin-top:16px"><button class="ghost" value="x">Cancel</button><button value="ok">Save</button></div></form>`;
d.onclose=async()=>{if(d.returnValue!='ok')return;const v={};fields.forEach(f=>v[f[0]]=$('#f_'+f[0]).value||null);try{await ok(v)}catch(e){}};d.showModal()}
async function boot(){const m=await api('/me');if(!m.user){return authView()}S.me=m;if(!S.pid||!m.patients.find(p=>p.id==S.pid))S.pid=m.patients[0]?.id;if(!S.pid)return setupView();await load()}
async function load(){S.data=await api(`/patients/${S.pid}/dashboard`);render()}
function authView(){$('#app').innerHTML=`<h1>Sehat Saathi</h1><p>Medicines, appointments and care updates for the whole family.</p><div class="card"><h2>Sign in</h2><label for="e">Email</label><input id="e" type="email" autocomplete="username"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><p><button id="go">Sign in</button> <button class="ghost" id="reg">Create account</button></p></div>`;
$('#go').onclick=async()=>{await api('/login','POST',{email:$('#e').value,password:$('#p').value});boot()};
$('#reg').onclick=()=>ask('Create account',[['name','Full name'],['email','Email','email'],['password','Password (8+ characters)','password']],async v=>{await api('/register','POST',v);boot()})}
function setupView(){$('#app').innerHTML=`<h1>Welcome${S.me?', '+E(S.me.user.name):''}</h1>${S.me&&S.me.pending.length?'<div class="card"><b>Your request is waiting for the patient to approve it.</b></div>':''}<div class="card"><h2>Start a care profile</h2><p>Create a shared profile for a parent or relative. Set a passcode and share it only with people who should have access.</p><button id="mk">Create profile</button></div><div class="card"><h2>Join an existing profile</h2><button class="ghost" id="jn">Join with passcode</button></div><button class="ghost" onclick="out()">Sign out</button>`;
$('#mk').onclick=()=>ask('New care profile',[['name','Patient name'],['age','Age','number'],['notes','Health notes'],['passcode','Passcode (6+ characters)','password']],async v=>{await api('/patients','POST',v);boot()});
$('#jn').onclick=()=>ask('Join profile',[['patient_id','Profile ID','number'],['passcode','Passcode','password'],['role','Your role','select',[['family','Family member'],['caregiver','Caregiver'],['patient','I am the patient']]],['consent','Patient consent','select',[['','Choose…'],['yes','The patient has agreed to share their health data with me']]]],async v=>{const r=await api('/join','POST',{...v,consent:v.consent=='yes'});say(r.status=='pending'?'Request sent. The patient must approve it.':'Joined');boot()})}
async function out(){await api('/logout','POST');S={me:null,pid:null,data:null,tab:'today'};boot()}
const logDetail=a=>a.action=='profile created'?'care profile for '+a.detail:a.detail;
const tag=s=>`<span class="tag ${s}">${s[0].toUpperCase()+s.slice(1)}</span>`,fmt=t=>t?E(t.replace('T',' ')):'';
function render(){const D=S.data,r=D.role,fam=true/* every active member, the patient included, can manage the care plan */,pat=r=='patient';
const tabs=[['today','Today'],['meds','Medicines'],['appts','Appointments'],['tasks','Tasks'],['alerts','Alerts'+(D.notifications.filter(n=>!n.read).length?` (${D.notifications.filter(n=>!n.read).length})`:'')]];tabs.push(['circle','Care circle'],['report','Adherence'],['log','Activity']);
$('#app').innerHTML=`<header><div><h1>${E(D.patient.name)}</h1><span class="mut">Signed in as ${E(S.me.user.name)} · ${r} · profile ID ${D.patient.id}</span></div><div><button class="ghost" onclick="bigText()" aria-label="Toggle larger text">A+ Larger text</button> <button class="ghost" onclick="out()">Sign out</button></div></header><nav aria-label="Sections">${tabs.map(t=>`<button data-t="${t[0]}" ${S.tab==t[0]?'aria-current="true"':''}>${t[1]}</button>`).join('')}</nav><section>${V[S.tab](D,r,fam,pat)}</section><button class="mic" onclick="talk()"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg> Talk</button>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()})
if(S.tab=='today')loadSummary()}
const doseAct=(d,r)=>d.status=='taken'||d.status=='skipped'?'':`<div class="row" style="margin-top:8px"><button class="big" onclick="dose(${d.id},'taken')">${d.status=='missed'?'I took it (late)':'I took it'}</button><button class="ghost" onclick="skip(${d.id})">Skip this dose</button>${r!='patient'&&d.status!='missed'?`<button class="ghost" onclick="miss(${d.id})">Record as missed</button>`:''}</div>`;
const V={today:(D,r)=>{const n=D.doses.length,t=D.doses.filter(d=>d.status=='taken').length,u=D.doses.filter(d=>d.status=='unconfirmed').length,a=D.appointments.find(a=>a.status=='scheduled'&&a.when_at>=new Date().toISOString().slice(0,16));
return `<div id="sum" class="card">Loading summary…</div>`+checkin(D)+`<div class="card"><h2 style="margin-top:0">Today</h2><p>${n} dose${n==1?'':'s'} scheduled: ${t} confirmed taken, ${u} not yet confirmed.${a?` Next appointment: Dr ${E(a.doctor)}, ${fmt(a.when_at)}.`:''}</p></div>`+(D.doses.map(d=>doseCard(d,r)).join('')||'<p>No doses scheduled today.</p>')+`<h2>Emergency</h2><button class="bad big" onclick="sos()">Emergency: alert my family</button><p class="mut">Alerts family and caregivers, with your location if you allow it. It does not call emergency services. Call your local emergency number first.</p>`},
meds:(D,r,f)=>(f?'<button onclick="medForm()">Add medicine</button>':'')+D.meds.map(m=>`<div class="card"><div class="row"><div><b>${E(m.name)}</b> ${E(m.dosage)}<br><span class="mut">At ${E(m.times)} · ${E(m.instructions||'no instructions')}<br><a href="https://dailymed.nlm.nih.gov/dailymed/search.cfm?query=${encodeURIComponent(m.name)}" target="_blank" rel="noopener">Official drug label (DailyMed)</a><br>${m.start?'From '+E(m.start):''} ${m.end?'to '+E(m.end):''}</span></div><div>${m.days_left==null?'':`<span class="tag ${m.days_left<=5?'missed':'taken'}">${m.days_left} days left</span>`}</div></div>${f?`<div class="row" style="margin-top:8px"><button class="ghost" onclick='medForm(${E(JSON.stringify(m)).replace(/'/g,"&#39;")})'>Edit</button><button class="ghost bad" onclick="delMed(${m.id})">Delete</button></div>`:''}</div>`).join(''),
appts:(D,r,f)=>(f?'<button onclick="apptForm()">Add appointment</button>':'')+D.appointments.map(a=>`<div class="card"><div class="row"><div><b>Dr ${E(a.doctor)}</b> ${E(a.speciality||'')}<br>${fmt(a.when_at)} · ${E(a.place||'')}<br><span class="mut">${E(a.contact||'')} ${E(a.notes||'')}</span></div><span class="tag ${a.status=='scheduled'?'upcoming':a.status=='completed'?'taken':'missed'}">${a.status}</span></div>${f?`<div class="row" style="margin-top:8px"><button class="ghost" onclick='apptForm(${E(JSON.stringify(a)).replace(/'/g,"&#39;")})'>Edit / cancel</button></div>`:''}</div>`).join(''),
